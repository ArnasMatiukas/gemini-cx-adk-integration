[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skincare_adk_agent"
version = "1.0.0"
description = "Google ADK Skincare Specialist Agent deployed on Vertex AI Agent Runtime (reasoningEngines) and integrated with Gemini Enterprise for Customer Experience (GECX)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.10.0",
    "google-cloud-aiplatform>=1.70.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "pillow>=10.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skincare_adk_agent*"]
